[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.29"
wgpu = "0.19"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
glam = { version = "0.27", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.3"
log = "0.4"

[profile.dev]
opt-level = 2
